name: Recover unpublished v0.2.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  recover:
    if: github.repository == 'Yashwanth034/TeraRelay'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_SHA: 104c7f8d63b0ef260d887e0f6f736454dca3ae3f
      VERIFIED_SHA: 212f784df0e30270794a1914559119d039b69bc2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard and retarget unpublished v0.2.0 tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already has a GitHub Release; refusing to retarget it." >&2
            exit 1
          fi
          current="$(git ls-remote origin refs/tags/v0.2.0 | awk '{print $1}')"
          if [ "$current" != "$FAILED_SHA" ] && [ "$current" != "$VERIFIED_SHA" ]; then
            echo "v0.2.0 points to unexpected commit $current; refusing to modify it." >&2
            exit 1
          fi
          version="$(git show "$VERIFIED_SHA:app/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$version" = "0.2.0"
          if [ "$current" = "$FAILED_SHA" ]; then
            git tag -f v0.2.0 "$VERIFIED_SHA"
            git push --force origin refs/tags/v0.2.0
          fi
          updated="$(git ls-remote origin refs/tags/v0.2.0 | awk '{print $1}')"
          test "$updated" = "$VERIFIED_SHA"
      - name: Dispatch normal release workflow at verified tag
        run: gh workflow run release.yml --ref v0.2.0
