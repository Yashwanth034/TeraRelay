name: Feature request
description: Suggest a focused improvement for TeraRelay
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first, then the proposed improvement. Please avoid including private account or file information.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What would you like TeraRelay to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional. Mention workarounds, related tools, or constraints.
