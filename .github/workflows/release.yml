name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop release / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build and attach desktop bundles
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "TeraRelay v__VERSION__"
          releaseBody: "Cross-platform TeraRelay release. See the attached platform packages and checksums."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    name: Android release build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and NDK r28
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          NDK_VERSION="$(sdkmanager --list | sed -n 's/^[[:space:]]*ndk;\([^ ]*\).*/\1/p' | grep '^28\.' | sort -V | tail -1)"
          test -n "$NDK_VERSION"
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: android-release

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android native project
        run: npm run tauri -- android init --ci

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_BASE64_1: ${{ secrets.ANDROID_KEY_BASE64_1 }}
          ANDROID_KEY_BASE64_2: ${{ secrets.ANDROID_KEY_BASE64_2 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEY_BASE64_1"
          test -n "$ANDROID_KEY_BASE64_2"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"

          key_file="$RUNNER_TEMP/terarelay-upload.p12"
          printf '%s%s' "$ANDROID_KEY_BASE64_1" "$ANDROID_KEY_BASE64_2" | base64 --decode > "$key_file"
          chmod 600 "$key_file"

          cat > src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$key_file
          storeType=PKCS12
          EOF

          python3 ../scripts/configure-android-signing.py

      - name: Build signed release APK and AAB
        run: npm run tauri -- android build --apk true --aab true --target aarch64 --ci

      - name: Verify Android release signatures
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          test -n "$apk"
          test -n "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify -strict "$aab"

      - name: Upload signed Android release outputs
        uses: actions/upload-artifact@v7
        with:
          name: terarelay-android-signed
          if-no-files-found: error
          path: |
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  ios-simulator:
    name: iOS simulator release validation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ios-simulator-release

      - name: Ensure CocoaPods is available
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS native project
        run: npm run tauri -- ios init --ci

      - name: Work around Xcode 26 MetalToolchain linker regression
        shell: bash
        run: |
          xcodebuild -showComponent MetalToolchain || true
          xcodebuild -deleteComponent MetalToolchain || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"

      - name: Build iOS simulator application
        run: npm run tauri -- ios build --target aarch64-sim --ci

      - name: Upload iOS simulator output
        uses: actions/upload-artifact@v7
        with:
          name: terarelay-ios-simulator
          if-no-files-found: error
          path: app/src-tauri/gen/apple/build/**/*
