name: Cross-platform CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, tests and Linux baseline
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             patchelf             xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Source hygiene
        working-directory: .
        run: bash scripts/check-source.sh

      - name: Frontend build
        run: npm run build

      - name: Locale structure
        run: node check-i18n.cjs

      - name: JavaScript dependency audit
        run: npm audit --audit-level=high

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: app/src-tauri
        run: cargo check --locked

      - name: Rust tests
        working-directory: app/src-tauri
        run: cargo test --locked

      - name: Python worker syntax
        run: python3 -m py_compile src-tauri/src/tdlib_fast_worker.py

  desktop:
    name: Desktop package / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            artifact: terarelay-linux-x64
          - name: Windows x64
            os: windows-latest
            args: ""
            artifact: terarelay-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact: terarelay-macos-arm64
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            artifact: terarelay-macos-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: desktop-${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build distributable desktop bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --ci ${{ matrix.args }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: app/src-tauri/target/**/release/bundle/**/*

  android:
    name: Android ARM64 build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and NDK r28
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          NDK_VERSION="$(sdkmanager --list | sed -n 's/^[[:space:]]*ndk;\([^ ]*\).*/\1/p' | grep '^28\.' | sort -V | tail -1)"
          test -n "$NDK_VERSION"
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android native project
        run: npm run tauri -- android init --ci

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/terarelay-android-build.log"
          if npm run tauri -- android build --apk true --target aarch64 --ci 2>&1 | tee "$log_file"; then
            exit 0
          fi
          details="$(tail -n 60 "$log_file")"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Android build failed::$details"
          exit 1

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ios-simulator

      - name: Ensure CocoaPods is available
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS native project
        run: npm run tauri -- ios init --ci

      - name: Work around Xcode 26 MetalToolchain linker regression
        shell: bash
        run: |
          xcodebuild -showComponent MetalToolchain || true
          xcodebuild -deleteComponent MetalToolchain || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"

      - name: Build iOS simulator application
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/terarelay-ios-build.log"
          if npm run tauri -- ios build --target aarch64-sim --ci 2>&1 | tee "$log_file"; then
            exit 0
          fi
          details="$(grep -Ei 'error:|fatal error|failed|cannot|undefined|linker command failed|not found' "$log_file" | tail -n 30 || true)"
          if [ -z "$details" ]; then
            details="$(tail -n 30 "$log_file")"
          fi
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=iOS simulator build failed::$details"
          exit 1
