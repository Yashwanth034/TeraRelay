[package]
name = "terarelay"
version = "0.2.3"
description = "TeraRelay private Telegram-backed file storage client."
authors = ["Yashwanth"]
license-file = "../../LICENSE"
repository = "https://github.com/Yashwanth034/TeraRelay"
homepage = "https://github.com/Yashwanth034/TeraRelay"
edition = "2021"



[lib]

name = "terarelay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Note: a multi-connection fork exists at github.com/xelema/grammers (branch
# multi-connection) but free Telegram accounts hit FLOOD_PREMIUM_WAIT with it;
# upstream single-connection is the right default for non-premium accounts.
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-mtproto = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hmac = "0.12"
zeroize = "1.8"
log = "0.4"
env_logger = "0.11"
actix-web = { version = "4", default-features = false, features = ["macros", "cookies"] }
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
bitflags = "=2.10.0"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
minisign-verify = "0.3"
md5 = "0.8"
bcrypt = "0.16"
constant_time_eq = "0.3"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
walkdir = "2"
sqlite = { version = "0.37.0", features = ["bundled"] }
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "blocking", "rustls-tls", "socks"] }
sysinfo = "0.30"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
mime_guess = "2"
unicode-normalization = "0.1"

[target.'cfg(not(target_os = "ios"))'.dependencies]
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls", "http-api-client"] }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-process = "2"
# Tauri v2 artifacts are signed MSI/NSIS installers, not v1-compatible ZIPs.
# Keep TLS and system-proxy support but disable the legacy ZIP extractor, which
# pulls vulnerable zip 4.x into Windows builds.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", default-features = false, features = ["abi-7-31"] }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Foundation",
  "Storage",
  "Storage_Provider",
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_CorrelationVector",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_Threading",
] }
notify = { version = "8.2.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.1"
libc = "0.2"
objc2 = "0.6.2"
objc2-file-provider = { version = "0.3.2", default-features = false, features = ["std", "Extension", "NSFileProviderDomain", "NSFileProviderItem", "block2"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
jni = "0.21"
ndk-context = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[workspace]
members = ["vendor/grammers-mtsender", "vendor/librqbit-utp"]
default-members = ["."]
resolver = "2"

[patch."https://github.com/Lonami/grammers"]
# Retain the session-compatible Grammers family; only transport DNS is patched.
grammers-mtsender = { path = "vendor/grammers-mtsender" }

[patch.crates-io]
# Preserve uTP APIs while using the fixed ringbuf line.
librqbit-utp = { path = "vendor/librqbit-utp" }

[package.metadata.tauri.bundle.windows]
# Embed the WebView2 bootstrapper so the app works on Windows systems
# where the WebView2 runtime is not pre-installed (fresh installs, servers, etc.)
webview-install-mode = "embeddir"

