name: Cross-platform CI

on:
  workflow_dispatch:
    inputs:
      source_only:
        description: Run source and test-only CI without building installers (default)
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, tests and Linux baseline
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg \
            xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Source hygiene
        working-directory: .
        run: bash scripts/check-source.sh

      - name: File Provider packaging regression tests
        working-directory: .
        run: python3 scripts/test-macos-file-provider-build.py

      - name: Archive preview and signed-updater security contracts
        working-directory: .
        run: |
          node scripts/test-rar-preview-failclosed.cjs
          node scripts/test-app-updater.cjs

      - name: Frontend build
        run: npm run build

      - name: Desktop interaction, native platform and recovery regression tests
        working-directory: .
        run: >-
          node --test --test-concurrency=1
          scripts/test-file-selection-scroll.cjs
          scripts/test-thumbnail-visibility.cjs
          scripts/test-remote-import-recovery-controls.cjs
          scripts/test-auth-query-isolation.cjs
          scripts/test-saved-session-restore.cjs
          scripts/test-focused-ui.cjs
          scripts/test-remote-import-background.cjs
          scripts/test-remote-import-batch-cancel.cjs
          scripts/test-transfer-recovery.cjs
          scripts/test-native-drive-platforms.cjs
          scripts/test-settings-accessibility.cjs
          scripts/test-settings-tab-trap.cjs
          scripts/test-secondary-modal-accessibility.cjs
          scripts/test-version-stack-accessibility.cjs
          scripts/test-bulk-share-accessibility.cjs
          scripts/test-share-clipboard.cjs

      - name: Playback, batch import and mount recovery contract tests
        working-directory: .
        run: |
          node scripts/test-playback-seeking.cjs
          node scripts/test-remote-import-ui.cjs
          node scripts/test-remote-import-batch.cjs
          node scripts/test-drive-mount-recovery.cjs

      - name: Locale structure
        run: node check-i18n.cjs

      - name: JavaScript dependency audit
        run: npm audit --audit-level=high

      - name: Rust format
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Rust check
        working-directory: app/src-tauri
        run: cargo check --locked

      - name: Outstanding RustSec reachability regression (not an audit waiver)
        working-directory: .
        run: python3 scripts/test-rustsec-reachability.py

      - name: Patched SOCKS and uTP dependency regressions
        timeout-minutes: 10
        working-directory: app/src-tauri
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test --locked -p grammers-mtsender --lib --features proxy net::tcp::tests -- --test-threads=1
          cargo test --locked -p librqbit-utp --lib ringbuf_compat_tests -- --test-threads=1
          RUST_LOG=warn cargo test --locked -p librqbit-utp --lib e2e_tests::e2e_test_librqbit_utp_client_librqbit_utp_server -- --exact --test-threads=1

      - name: Rust tests
        # Real FFmpeg/HTTP fixtures launch processes and local servers. Run
        # them serially, matching native-host CI and the verified local suite,
        # to keep their process and HTTP fixture lifetimes from overlapping.
        timeout-minutes: 25
        working-directory: app/src-tauri
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --locked -- --test-threads=1

      - name: Strict Rust Clippy (all targets, warnings denied)
        timeout-minutes: 10
        working-directory: app/src-tauri
        # Each stable high-arity Tauri/transfer/metadata signature carries a
        # documented, exact-function #[expect] rather than a global lint waiver.
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Native HTTP range, V2 cache and pending-read integrity fixtures
        timeout-minutes: 3
        working-directory: .
        run: |
          python3 scripts/test-drive-http-range.py
          python3 scripts/test-drive-v2-read-recovery.py
          python3 scripts/test-drive-pending-read-integrity.py

      - name: Upload progress and disposable-cache cleanup fixtures
        working-directory: .
        run: |
          python3 scripts/test-upload-progress.py
          python3 scripts/test-tdlib-cache-cleanup.py

      - name: Python worker syntax
        run: python3 -m py_compile src-tauri/src/tdlib_fast_worker.py

  linux-webkit-media-e2e:
    name: Real WebKitGTK player, seeking and audio-switch E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7

      - name: Install isolated Linux WebKit media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            python3-gi \
            gir1.2-webkit2-4.1 \
            xvfb \
            xauth \
            ffmpeg \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio \
            pulseaudio \
            pulseaudio-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build frontend assets for isolated player fixture
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Run actual WebKitGTK playback and seek E2E without bypassing sandbox
        timeout-minutes: 10
        run: |
          # WebKit's GStreamer autoaudiosink requires a working audio device.
          # A headless runner has no speakers, so provide a real PulseAudio
          # null sink rather than skipping the playback/seek assertions.
          pulseaudio --check || pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=terarelay_ci
          pactl set-default-sink terarelay_ci
          pactl info
          node scripts/test-native-media.cjs

  linux-native-drive-e2e:
    name: Real Linux FUSE, accessibility, recovery, cache and project E2E (synthetic QA)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install native Linux GUI, DBus and FUSE test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3 \
            libfuse3-dev \
            xvfb \
            xauth \
            openbox \
            x11-utils \
            wmctrl \
            xdotool \
            dbus-x11 \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-atspi-2.0 \
            at-spi2-core

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: isolated-native-fuse-e2e

      - name: Build private test frontend and native debug application (no installer)
        run: |
          cd app
          npm ci
          npm run build
          cd src-tauri
          CARGO_BUILD_JOBS=2 cargo build --locked

      - name: Require an accessible real FUSE device
        run: |
          test -c /dev/fuse || { echo "BLOCKED: this runner lacks /dev/fuse; real native E2E did not run"; exit 2; }
          command -v fusermount3
          command -v wmctrl
          command -v xdotool
          test -x app/src-tauri/target/debug/terarelay

      - name: Run ten isolated native accessibility, filesystem, recovery and cache QA suites
        timeout-minutes: 22
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          mkdir -p .repotunnel-tmp
          VITE_TERA_QA_FEATURE_A=1 npm --prefix app run dev -- --host 127.0.0.1 --port 1420 --strictPort > "$RUNNER_TEMP/terarelay-native-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:1420/ >/dev/null; then break; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then cat "$RUNNER_TEMP/terarelay-native-vite.log"; exit 1; fi
            sleep 0.25
          done
          curl --silent --fail http://127.0.0.1:1420/ >/dev/null || { echo "BLOCKED: private QA frontend did not start"; exit 2; }
          xvfb-run -a dbus-run-session -- bash scripts/test-native-drive-ci-runner.sh

  rustsec-audit:
    name: Rust dependency vulnerability audit (no ignores)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install verified cargo-audit binary on ephemeral CI runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
          fallback: none

      - name: Fail on unresolved RustSec vulnerabilities
        working-directory: app/src-tauri
        run: cargo audit --file Cargo.lock

  native-host-tests:
    name: Native Rust tests / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS ARM64
            os: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: native-host-tests-${{ matrix.name }}

      - name: Ensure FFmpeg and ffprobe for native media regressions
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              choco install ffmpeg --yes --no-progress
            else
              brew install ffmpeg
            fi
          fi
          ffmpeg -version
          ffprobe -version

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for Tauri test compilation
        run: npm run build

      - name: Diagnose native filesystem contracts before the full test suite
        working-directory: app/src-tauri
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
          # macOS defaults TMPDIR to /var/folders, where /var itself is a
          # symlink. Safety tests intentionally refuse symlinked ancestors.
          # The runner's isolated, symlink-free temp root is suitable for QA.
          TMPDIR: ${{ runner.temp }}
        run: |
          if [[ "${{ matrix.name }}" == "Windows x64" ]]; then
            cargo test --locked --lib download_output::tests::resumable_rechecks_saved_bytes_and_keeps_other_source_separate -- --exact --nocapture --test-threads=1
          else
            cargo test --locked --lib cache_cleanup::tests::prune_below_budget_does_not_sort_or_evict_unchanged_entries -- --exact --nocapture --test-threads=1
          fi

      - name: Test native Rust backend on the actual host operating system
        working-directory: app/src-tauri
        env:
          CARGO_BUILD_JOBS: "2"
          TMPDIR: ${{ runner.temp }}
        run: cargo test --locked -- --test-threads=1

  desktop:
    if: ${{ !inputs.source_only }}
    name: Desktop package / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            args: ""
            artifact: terarelay-linux-x64
          - name: Windows x64
            os: windows-latest
            args: ""
            artifact: terarelay-windows-x64
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            artifact: terarelay-macos-arm64
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            artifact: terarelay-macos-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: desktop-${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS File Provider against minimum OS
        if: runner.os == 'macOS'
        working-directory: .
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TERARELAY_MACOS_SWIFT_TRIPLE: ${{ matrix.name == 'macOS Intel' && 'x86_64-apple-macosx12.0' || 'arm64-apple-macosx12.0' }}
        run: bash scripts/build-macos-file-provider.sh

      - name: Configure CI bundles without release updater artifacts
        shell: bash
        run: |
          node -e "require('fs').writeFileSync('src-tauri/tauri.ci.conf.json', JSON.stringify({bundle:{createUpdaterArtifacts:false}}))"

      - name: Build distributable desktop bundles
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TERARELAY_MACOS_SWIFT_TRIPLE: ${{ matrix.name == 'macOS Intel' && 'x86_64-apple-macosx12.0' || 'arm64-apple-macosx12.0' }}
        run: npm run tauri -- build --ci --config src-tauri/tauri.ci.conf.json ${{ matrix.args }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: app/src-tauri/target/**/release/bundle/**/*

  android:
    if: ${{ !inputs.source_only }}
    name: Android ARM64 build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and NDK r28
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          NDK_VERSION="$(sdkmanager --list | sed -n 's/^[[:space:]]*ndk;\([^ ]*\).*/\1/p' | grep '^28\.' | sort -V | tail -1)"
          test -n "$NDK_VERSION"
          sdkmanager             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: android-aarch64

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android native project
        run: npm run tauri -- android init --ci

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/terarelay-android-build.log"
          if npm run tauri -- android build --apk --target aarch64 --ci 2>&1 | tee "$log_file"; then
            exit 0
          fi
          details="$(tail -n 60 "$log_file")"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Android build failed::$details"
          exit 1

  ios-simulator:
    if: ${{ !inputs.source_only }}
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ios-simulator

      - name: Ensure CocoaPods is available
        run: command -v pod >/dev/null || brew install cocoapods

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS native project
        run: npm run tauri -- ios init --ci

      - name: Work around Xcode 26 MetalToolchain linker regression
        shell: bash
        run: |
          xcodebuild -showComponent MetalToolchain || true
          xcodebuild -deleteComponent MetalToolchain || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"

      - name: Build iOS simulator application
        shell: bash
        run: |
          set -o pipefail
          log_file="$RUNNER_TEMP/terarelay-ios-build.log"
          if npm run tauri -- ios build --target aarch64-sim --ci 2>&1 | tee "$log_file"; then
            exit 0
          fi
          details="$(grep -Ei 'error:|fatal error|failed|cannot|undefined|linker command failed|not found' "$log_file" | tail -n 30 || true)"
          if [ -z "$details" ]; then
            details="$(tail -n 30 "$log_file")"
          fi
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=iOS simulator build failed::$details"
          exit 1
