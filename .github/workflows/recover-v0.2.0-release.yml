name: Recover unpublished v0.2.0 release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  recover:
    if: github.repository == 'Yashwanth034/TeraRelay'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      FAILED_SHA: 443e7c1f188f3b41449b81af1896b521386223ee
      VERIFIED_SHA: 86f256d225b1eebc3a31072887f17fbf942c8289
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Remove only incomplete draft and retarget unpublished v0.2.0 tag
        shell: bash
        run: |
          set -euo pipefail
          release_rows="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.2.0") | [.id, .draft, (.published_at // ""), (.target_commitish // "")] | @tsv')"
          if [ -n "$release_rows" ]; then
            count="$(printf '%s\n' "$release_rows" | sed '/^$/d' | wc -l | tr -d ' ')"
            test "$count" = "1"
            IFS=$'\t' read -r release_id is_draft published_at target_commitish <<< "$release_rows"
            if [ "$is_draft" != "true" ] || [ -n "$published_at" ]; then
              echo "v0.2.0 has a published/non-draft GitHub Release; refusing recovery." >&2
              exit 1
            fi
            echo "Deleting incomplete draft Release $release_id (target: $target_commitish) before retagging."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi

          current="$(git ls-remote origin refs/tags/v0.2.0 | awk '{print $1}')"
          if [ "$current" != "$FAILED_SHA" ] && [ "$current" != "$VERIFIED_SHA" ]; then
            echo "v0.2.0 points to unexpected commit $current; refusing to modify it." >&2
            exit 1
          fi

          version="$(git show "$VERIFIED_SHA:app/package.json" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$version" = "0.2.0"

          if [ "$current" = "$FAILED_SHA" ]; then
            git tag -f v0.2.0 "$VERIFIED_SHA"
            git push --force origin refs/tags/v0.2.0
          fi

          updated="$(git ls-remote origin refs/tags/v0.2.0 | awk '{print $1}')"
          test "$updated" = "$VERIFIED_SHA"
      - name: Dispatch normal release workflow at verified tag
        run: gh workflow run release.yml --ref v0.2.0
